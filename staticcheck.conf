# ST1005 exige des messages d'erreur en minuscule et sans ponctuation finale.
# La règle suppose des erreurs anglaises destinées à être enchâssées dans une
# phrase plus longue. Ici, une bonne partie des erreurs sont des messages
# FRANÇAIS affichés tels quels à l'utilisateur, dans le chat ou dans le
# terminal (« ⏳ Le modèle est encore en train de charger — réessaie dans
# quelques secondes. »). Les rendre conformes reviendrait à dégrader le produit
# pour satisfaire l'outil. On désactive donc la règle, plutôt que de laisser
# traîner des avertissements permanents qu'on apprendrait à ignorer.
checks = ["inherit", "-ST1005"]
