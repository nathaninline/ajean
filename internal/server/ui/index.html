// ===== Kit : toast, fenêtres, confirmations, menu ============================
let toastTimer=0;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
// .show est posée une frame après l'affichage pour que la transition joue ; à la
// fermeture on attend sa fin avant de repasser en display:none. onModalClose[id] :
// ménage à faire dès qu'une fenêtre se ferme, quelle qu'en soit la façon.
const onModalClose={};
function showModal(id){
  const el=$(id);el.style.display='flex';void el.offsetHeight;el.classList.add('show');
  el.querySelectorAll('.seg').forEach(bar=>placeSeg(bar,true));   // enfin mesurables
}
function hideModal(id){
  const el=$(id);el.classList.remove('show');
  closeTip();                       // une bulle d'aide épinglée ne survit pas à sa fenêtre
  if(onModalClose[id])onModalClose[id]();
  setTimeout(()=>{if(!el.classList.contains('show'))el.style.display='none'},180);
}
const modalOpen=id=>$(id).classList.contains('show');
document.querySelectorAll('.modal-ov').forEach(m=>{
  m.addEventListener('mousedown',e=>{if(e.target===m)hideModal(m.id)});
  m.querySelector('[data-close]').onclick=()=>hideModal(m.id);
});

// ask() : boîte stylée qui renvoie une promesse. Sans champ → true/false ;
// avec `input` → le texte saisi, ou null si annulé. Échap annule, Entrée valide.
let askDone=null;
function ask({title,msg='',ok='OK',danger=false,input=false,value='',placeholder='',password=false}){
  if(askDone)askDone(false);
  $('ask-title').textContent=title;$('ask-msg').textContent=msg;
  const inp=$('ask-input'),okb=$('ask-ok');
  inp.hidden=!input;inp.type=password?'password':'text';inp.value=value;inp.placeholder=placeholder;
  okb.textContent=ok;okb.className='btn '+(danger?'danger':'primary');
  showModal('ask');(input?inp:okb).focus();if(input)inp.select();
  return new Promise(res=>{askDone=yes=>{askDone=null;hideModal('ask');res(input?(yes?inp.value:null):yes)}});
}
$('ask-ok').onclick=()=>askDone&&askDone(true);
$('ask-cancel').onclick=()=>askDone&&askDone(false);
$('ask').addEventListener('mousedown',e=>{if(e.target===e.currentTarget&&askDone)askDone(false)});

// ----- Sélecteur glissant ----------------------------------------------------
// Onglets et choix en pastilles gardent leur état dans le DOM : le ou les boutons
// .on (data-v : la valeur). Dans une barre .seg, une pastille unique marque le
// choix : placeSeg la pose sous le bouton .on, et elle y glisse (transition CSS).
// `jump` la pose sans glisser : à l'ouverture d'une fenêtre, au redimensionnement,
// au changement de langue. Une barre invisible ne se mesure pas : la pastille
// attend que sa fenêtre s'ouvre.
const segValues=id=>[...$(id).querySelectorAll('.on')].map(b=>b.dataset.v);
function setSeg(id,on){
  const bar=$(id);
  for(const b of bar.querySelectorAll('button'))b.classList.toggle('on',on.includes(b.dataset.v));
  if(bar.classList.contains('seg'))placeSeg(bar);
}
function placeSeg(bar,jump){
  let pill=bar.querySelector('.seg-pill');
  if(!pill){
    pill=bar.insertBefore(Object.assign(document.createElement('span'),{className:'seg-pill',hidden:true}),bar.firstChild);
    // Mesurée cachée, la barre n'a pas de taille : on la replace dès qu'elle en prend une.
    if(window.ResizeObserver)new ResizeObserver(()=>placeSeg(bar,true)).observe(bar);
  }
  const on=bar.querySelector('button.on'),was=pill.hidden;
  pill.hidden=!on||!on.offsetWidth;
  if(pill.hidden)return;
  if(jump||was)pill.style.transition='none';       // pas de glissement depuis nulle part
  pill.style.width=on.offsetWidth+'px';pill.style.transform='translateX('+on.offsetLeft+'px)';
  if(jump||was){void pill.offsetWidth;pill.style.transition=''}
  // Barre plus large que l'écran : le choix actif est amené dans la vue.
  bar.scrollLeft=Math.max(on.offsetLeft+on.offsetWidth+3-bar.clientWidth,Math.min(bar.scrollLeft,on.offsetLeft-3));
}
const placeSegs=()=>document.querySelectorAll('.seg').forEach(bar=>placeSeg(bar,true));
addEventListener('resize',placeSegs);
document.fonts.ready.then(placeSegs);              // la police arrive après le premier rendu : les largeurs changent

// ----- Menus flottants -------------------------------------------------------
// UN seul système pour tous les petits menus : le ⋮ d'une conversation, le choix
// de la configuration, les modèles d'un fournisseur et les listes déroulantes.
// Un seul menu ouvert à la fois ; il se pose sous ou au-dessus de son ancre selon
// la place, reste dans l'écran, se pilote au clavier (↑ ↓ Entrée) et se referme
// au clic ailleurs, à Échap, au redimensionnement et quand son ancre défile.
//   items : {label, act, sub?, icon?, on?, danger?, disabled?}, {head:'Titre'} ou {sep:true}
//   opts  : minW (px, au moins la largeur de l'ancre), align 'left' | 'right',
//           filter (un champ en tête filtre les lignes : pour les longues listes)
let MENU=null;   // {el, anchor, rows, idx, o}
function closeMenu(){
  if(!MENU)return;
  const {el,anchor}=MENU;MENU=null;
  if(el.contains(document.activeElement))anchor.focus({preventScroll:true});   // le focus ne se perd pas avec le filtre
  el.classList.remove('open');anchor.classList.remove('open');setTimeout(()=>el.remove(),180);
}
function placeMenu(el,anchor,o){
  const r=anchor.getBoundingClientRect(),gap=6;
  el.style.maxHeight='';   // la hauteur naturelle se mesure sans la borne posée la fois d'avant
  if(o.minW)el.style.minWidth=Math.max(o.minW,r.width)+'px';
  const below=innerHeight-r.bottom-gap-8,above=r.top-gap-8;
  const up=below<Math.min(el.scrollHeight,240)&&above>below;
  el.style.maxHeight=Math.max(120,Math.min(380,up?above:below))+'px';
  const left=o.align==='right'?r.right-el.offsetWidth:r.left;
  el.style.left=Math.max(8,Math.min(left,innerWidth-el.offsetWidth-8))+'px';
  el.style.top=(up?r.top-gap-el.offsetHeight:r.bottom+gap)+'px';
  el.style.transformOrigin=(up?'bottom ':'top ')+(o.align==='right'?'right':'left');
}
function openMenu(anchor,items,o={}){
  if(MENU&&MENU.anchor===anchor)return closeMenu();   // un second clic sur l'ancre referme
  closeMenu();
  const el=document.createElement('div');el.className='menu';el.setAttribute('role','menu');
  const add=(parent,className,textContent)=>parent.appendChild(Object.assign(document.createElement('div'),{className,textContent}));
  const filter=o.filter?add(el,'menu-filter').appendChild(Object.assign(document.createElement('input'),{className:'ctl',type:'search',placeholder:t('menu.filter')})):null;
  const list=add(el,'menu-list'),rows=[],div=(className,textContent)=>add(list,className,textContent);
  for(const it of items){
    if(it.head){div('menu-head',it.head);continue}
    if(it.sep){div('menu-sep');continue}
    const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');
    b.classList.toggle('danger',!!it.danger);b.classList.toggle('on',!!it.on);b.disabled=!!it.disabled;
    b.innerHTML=(it.icon?ICON[it.icon]:'')+'<span>'+esc(it.label)+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span>';
    b.onclick=()=>{closeMenu();it.act()};
    list.appendChild(b);rows.push(b);
  }
  if(filter){
    filter.setAttribute('aria-label',t('menu.filter_aria'));
    const none=div('menu-head',t('menu.none'));none.hidden=true;
    // Les lignes qui ne contiennent pas le texte saisi sont masquées ; la première
    // qui reste est désignée, pour qu'Entrée la prenne sans quitter le champ.
    filter.oninput=()=>{
      const q=filter.value.trim().toLowerCase();
      rows.forEach(b=>{b.hidden=!b.textContent.toLowerCase().includes(q);b.classList.remove('kbd')});
      MENU.idx=rows.findIndex(b=>!b.hidden);
      if(MENU.idx>=0)rows[MENU.idx].classList.add('kbd');
      none.hidden=MENU.idx>=0;list.scrollTop=0;placeMenu(el,anchor,o);
    };
  }
  document.body.appendChild(el);
  placeMenu(el,anchor,o);
  MENU={el,anchor,rows,idx:rows.findIndex(b=>b.classList.contains('on')),o};
  if(MENU.idx>=0)rows[MENU.idx].scrollIntoView({block:'nearest'});
  void el.offsetWidth;   // l'état de départ est posé : le fondu peut partir
  anchor.classList.add('open');el.classList.add('open');
  // Avec une souris, on tape tout de suite dans le filtre ; au doigt, on ne fait
  // pas surgir le clavier sur une liste que l'on veut peut-être seulement parcourir.
  if(filter&&matchMedia('(hover:hover)').matches)filter.focus({preventScroll:true});
}
document.addEventListener('pointerdown',e=>{
  if(MENU&&!MENU.el.contains(e.target)&&!MENU.anchor.contains(e.target))closeMenu();
},true);
// Seul un défilement qui déplace l'ancre ferme le menu : le fil défile tout seul
// pendant une réponse, il ne doit pas refermer un menu ouvert ailleurs.
document.addEventListener('scroll',e=>{
  if(MENU&&!MENU.el.contains(e.target)&&e.target.contains&&e.target.contains(MENU.anchor))closeMenu();
},true);
// Toucher le filtre sur un téléphone fait surgir le clavier, qui redimensionne la
// fenêtre : le menu se replace alors au lieu de se fermer.
addEventListener('resize',()=>{
  if(MENU&&MENU.el.contains(document.activeElement))placeMenu(MENU.el,MENU.anchor,MENU.o);else closeMenu();
});
document.addEventListener('keydown',e=>{
  if(!MENU)return;
  const {rows}=MENU,ok=b=>!b.disabled&&!b.hidden;
  const move=d=>{
    if(!rows.some(ok))return;
    let i=MENU.idx;
    do{i=(i+d+rows.length)%rows.length}while(!ok(rows[i]));
    rows.forEach((b,k)=>b.classList.toggle('kbd',k===i));
    rows[i].scrollIntoView({block:'nearest'});MENU.idx=i;
  };
  if(!['ArrowDown','ArrowUp','Enter',' ','Tab'].includes(e.key))return;
  if(e.key===' '&&e.target.tagName==='INPUT'&&MENU.el.contains(e.target))return;   // une espace tapée dans le filtre
  e.stopImmediatePropagation();   // la touche est pour le menu, pas pour ce qu'il y a dessous
  if(e.key==='ArrowDown'){e.preventDefault();move(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();move(-1)}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(MENU.idx>=0)rows[MENU.idx].click()}
  else if(e.key==='Tab')closeMenu();
},true);

// ----- Listes déroulantes ----------------------------------------------------
// Les <select> restent dans la page (valeur, événement « change », mise en
// page) : seule leur OUVERTURE est interceptée, pour montrer le menu commun au
// lieu de la liste du navigateur. Choisir une option pose la valeur et déclenche
// « change » comme un vrai choix. Vaut aussi pour les listes créées plus tard.
const selectable=s=>s&&s.tagName==='SELECT'&&!s.multiple&&!s.disabled&&s.offsetParent!==null;
function openSelect(sel){
  const pick=o=>{
    if(!o.selected){o.selected=true;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}
    sel.focus({preventScroll:true});
  };
  const items=[];
  for(const c of sel.children){
    const opts=c.tagName==='OPTGROUP'?[...c.children]:[c];
    if(c.tagName==='OPTGROUP')items.push({head:c.label});
    for(const o of opts)if(o.tagName==='OPTION'&&!o.hidden)items.push({label:o.textContent,on:o.selected,disabled:o.disabled,act:()=>pick(o)});
  }
  if(items.length)openMenu(sel,items,{minW:150});
}
function interceptSelect(e){
  const sel=e.target.closest&&e.target.closest('select');
  if(!selectable(sel))return;
  e.preventDefault();   // pas de liste du navigateur (roue d'iOS comprise)
  openSelect(sel);
}
document.addEventListener('mousedown',e=>{if(e.button===0)interceptSelect(e)},true);
document.addEventListener('touchend',interceptSelect,{capture:true,passive:false});
// Au clavier : Entrée, Espace, F4 ou Alt+↓ ouvrent la liste qui a le focus.
document.addEventListener('keydown',e=>{
  const sel=document.activeElement;
  if(!MENU&&selectable(sel)&&(e.key==='Enter'||e.key===' '||e.key==='F4'||(e.altKey&&e.key==='ArrowDown'))){e.preventDefault();openSelect(sel)}
},true);

// ----- Bulles d'aide ---------------------------------------------------------
// Une pastille « ? » (.q) porte dans data-help la clé de son texte. Il n'y a qu'UNE
// bulle pour toute la page (#tip), donc une seule ouverte à la fois. Elle s'ouvre au
// survol et au focus du clavier ; un clic, ou un toucher, l'épingle : elle reste
// jusqu'au clic suivant, au clic ailleurs ou à Échap. Elle se pose sous sa pastille,
// au-dessus si la place manque, sans sortir de l'écran ni, de côté, de la fenêtre
// qui la contient. Des pastilles naissent après coup (onglets de la Mémoire) : tout
// est écouté sur le document.
let TIP=null;   // {anchor, pinned}
const help=key=>'<span class="qw">&nbsp;<button type="button" class="q" data-help="'+key+'" aria-label="'+esc(t('help'))+'"></button></span>';
function closeTip(){
  if(!TIP)return;
  TIP.anchor.classList.remove('open');TIP.anchor.removeAttribute('aria-describedby');TIP=null;
  $('tip').classList.remove('show');
}
function openTip(anchor,pinned){
  if(TIP&&TIP.anchor===anchor){TIP.pinned=TIP.pinned||pinned;return}
  closeTip();
  const el=$('tip'),r=anchor.getBoundingClientRect(),card=anchor.closest('.modal-card'),box=card?card.getBoundingClientRect():{left:0,right:innerWidth},gap=6;
  el.innerHTML=t(anchor.dataset.help);
  const left=r.left+r.width/2-el.offsetWidth/2,below=innerHeight-r.bottom-gap-8;
  el.style.left=Math.max(8,box.left+8,Math.min(left,innerWidth-8-el.offsetWidth,box.right-8-el.offsetWidth))+'px';
  el.style.top=(below<el.offsetHeight&&r.top>below?r.top-gap-el.offsetHeight:r.bottom+gap)+'px';
  anchor.classList.add('open');anchor.setAttribute('aria-describedby','tip');el.classList.add('show');
  TIP={anchor,pinned};
}
document.addEventListener('mouseover',e=>{const q=e.target.closest('.q');if(q)openTip(q,false)});
document.addEventListener('mouseout',e=>{if(TIP&&!TIP.pinned&&e.target===TIP.anchor)closeTip()});
// Le focus n'ouvre la bulle que s'il vient du clavier : à la souris, le survol l'a déjà fait.
document.addEventListener('focusin',e=>{if(e.target.matches('.q:focus-visible'))openTip(e.target,false)});
document.addEventListener('focusout',e=>{if(TIP&&e.target===TIP.anchor)closeTip()});
document.addEventListener('click',e=>{
  const q=e.target.closest('.q');
  if(q)TIP&&TIP.anchor===q&&TIP.pinned?closeTip():openTip(q,true);
});
document.addEventListener('pointerdown',e=>{
  if(TIP&&!$('tip').contains(e.target)&&!TIP.anchor.contains(e.target))closeTip();
},true);
// Comme un menu : la bulle ne suit pas une pastille qui défile, elle se ferme.
document.addEventListener('scroll',e=>{

// Échap ferme ce qui est au premier plan : confirmation, bulle d'aide, menu, fenêtre,
// tiroir. Entrée valide une confirmation ouverte.
document.addEventListener('keydown',e=>{
  if(askDone){
    if(e.key==='Escape'){e.preventDefault();askDone(false)}
    else if(e.key==='Enter'&&e.target.id!=='ask-cancel'){e.preventDefault();askDone(true)}
    return;
  }
  if(e.key!=='Escape')return;
  if(TIP){e.stopPropagation();return closeTip()}
  if(MENU){e.stopPropagation();return closeMenu()}
  const open=[...document.querySelectorAll('.modal-ov.show')].pop();
  if(open)hideModal(open.id);else toggleSide(false);
},true);

// ===== Accès au serveur ======================================================
// JSON dans les deux sens (FormData pour l'envoi de fichier). Une erreur arrive en
// {error} : un message du serveur, affiché tel quel. Sur 401 (pas de session, ou
// session éteinte), l'écran de connexion s'affiche et la requête est rejouée une
// fois la session ouverte.
//
// La session vit dans un cookie que le script ne peut pas lire (HttpOnly) : rien
// de secret n'est gardé par la page, et le navigateur le joint de lui-même à
// chaque requête, flux d'événements compris.
let loginWait=null,loginDone=null;
function login(){
  if(loginWait)return loginWait;                   // plusieurs requêtes refusées : un seul écran
  store.set('ajean-key','');                       // l'ancienne clé d'accès gardée sur l'appareil n'a plus cours
  setStatus('login-status','');$('login-pw').value='';
  $('login-warn').hidden=location.protocol==='https:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  $('login').hidden=false;$('login-pw').focus();
  return loginWait=new Promise(res=>{loginDone=()=>{loginWait=loginDone=null;$('login').hidden=true;$('login-pw').value='';res()}});
}
$('login-form').onsubmit=async e=>{
  e.preventDefault();
  const b=$('login-ok');b.disabled=true;setStatus('login-status','');
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('login-pw').value})});
    let j={};try{j=await r.json()}catch(err){}
    if(r.ok){if(loginDone)loginDone()}
    else{
      setStatus('login-status',r.status===429?t('login.wait',j.wait||60):r.status===401?t('login.wrong'):j.error||t('api.error',r.status),'err');
      $('login-pw').select();
    }
  }catch(err){setStatus('login-status',t('api.down'),'err')}
  b.disabled=false;
};
async function api(path,body){
  const opt={headers:{}};
  if(body instanceof FormData){opt.method='POST';opt.body=body}
  else if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  let r;
  try{r=await fetch(path,opt)}catch(e){throw new Error(t('api.down'))}
  if(r.status===401){await login();return api(path,body)}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||t('api.error',r.status));
  return j;
}

// ===== Markdown ==============================================================
// Rendu volontairement restreint : tout le texte est échappé AVANT la mise en
// forme, donc aucun HTML venu du modèle n'est interprété. Gère titres, listes
// (imbriquées), citations, tableaux, filets, gras, italique, barré, code, blocs
// de code, liens http(s), et le lien vers une app, [Nom](app:<id>), rendu en bouton
// qui l'ouvre, avec sa pastille. Tout autre schéma reste du texte.
function md(src){
  const kept=[];                                   // fragments HTML finis (code, liens), à l'abri des règles suivantes
  const keep=h=>'\u0001'+(kept.push(h)-1)+'\u0001';
  const restore=s=>s.replace(/\u0001(\d+)\u0001/g,(m,i)=>kept[i]);
  const link=(url,label)=>keep('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');
  const inline=s=>restore(esc(s)
    .replace(/`([^`\n]+)`/g,(m,c)=>keep('<code>'+c+'</code>'))
    .replace(/\[([^\]\n]+)\]\(app:([a-z0-9-]+)\)/g,(m,label,id)=>keep('<button class="btn sm" data-app="'+id+'">'+appGlyph(id)+label+'</button>'))
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,label,url)=>link(url,label))
    .replace(/https?:\/\/[^\s<\u0001]+/g,m=>{
      const url=m.replace(/(?:&quot;|&#39;|&gt;|&lt;|[.,;:!?)\]»*_])+$/,'');
      return link(url,url)+m.slice(url.length);
    })
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\s][^*\n]*)\*/g,'$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_\s][^_\n]*)_(?!\w)/g,'$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g,'<del>$1</del>'));

  let html='',para=[],list=[],quote=[],table=[],code=null;
  const pre=()=>{html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>';code=null};
  const flush=()=>{
    if(para.length){html+='<p>'+para.map(inline).join('<br>')+'</p>';para=[]}
    if(quote.length){html+='<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>';quote=[]}
    if(list.length){
      const open=[];                               // pile des listes ouvertes (ul / ol)
      for(const it of list){
        const d=Math.min(it.depth,open.length);
        while(open.length>d+1)html+='</li></'+open.pop()+'>';
        if(open.length===d+1&&open[d]!==it.tag)html+='</li></'+open.pop()+'>';
        if(open.length===d+1)html+='</li>';
        else{open.push(it.tag);html+='<'+it.tag+(it.start>1?' start="'+it.start+'"':'')+'>'}
        html+='<li>'+inline(it.text);
      }
      while(open.length)html+='</li></'+open.pop()+'>';
      list=[];
    }
    if(table.length){
      const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      const row=(l,tag)=>'<tr>'+cells(l).map(c=>'<'+tag+'>'+c+'</'+tag+'>').join('')+'</tr>';
      const sep=table.length>1&&/^[\s|:-]+$/.test(table[1]);
      html+='<table>'+(sep?'<thead>'+row(table[0],'th')+'</thead>':'')+'<tbody>'+table.slice(sep?2:0).map(l=>row(l,'td')).join('')+'</tbody></table>';
      table=[];
    }
  };
  for(const raw of String(src).replace(/\u0001/g,'').replace(/\r\n?/g,'\n').split('\n')){
    const l=raw.trimEnd(),t=l.trim();let m;
    if(code){if(t==='```')pre();else code.push(raw);continue}
    if(t.startsWith('```')){flush();code=[];continue}
    if(!t){flush();continue}
    if(m=t.match(/^(#{1,6})\s+(.*)$/)){flush();const n=Math.min(m[1].length,4);html+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';continue}
    if(/^(?:-{3,}|\*{3,}|_{3,})$/.test(t)){flush();html+='<hr>';continue}
    if(m=l.match(/^(\s*)(?:[-*+•]|(\d+)[.)])\s+(.*)$/)){
      if(!list.length)flush();
      list.push({depth:Math.floor(m[1].replace(/\t/g,'  ').length/2),tag:m[2]?'ol':'ul',start:+m[2]||1,text:m[3]});continue;
    }
    if(list.length&&/^\s/.test(l)){list[list.length-1].text+='\n'+t;continue}   // suite d'un élément de liste
    if(m=t.match(/^>\s?(.*)$/)){if(!quote.length)flush();quote.push(m[1]||'');continue}
    if(t.startsWith('|')&&t.endsWith('|')&&t.length>1){if(!table.length)flush();table.push(t);continue}
    if(list.length||quote.length||table.length)flush();
    para.push(t);
  }
  flush();
  if(code)pre();                                   // bloc non refermé : la réponse est encore en cours
  return html;
}

// ===== État ==================================================================
// preset : la configuration active (provider = le NOM de son fournisseur), id '' s'il
// n'y en a aucune ; presets : toutes, pour le sélecteur de la zone de saisie ;
// transcribe : une API de transcription est réglée.
const S={configured:false,preset:{id:'',name:'',model:'',effort:'',provider:''},presets:[],transcribe:false,convs:[],conv:'',busy:false};
let sleeping=false,offline=false;
const unseen=new Set();           // conversations où une réponse est arrivée sans être affichée

// L'état n'est affiché que s'il sort de l'ordinaire : quand tout va bien, rien
// à dire (une réponse en cours se voit déjà dans le fil et dans la liste).
function renderStatus(){
  const el=$('status');
  const [txt,cls]=offline?[t('status.offline'),'err']
    :!S.configured?[t('status.setup'),'']
    :sleeping?[t('status.sleep'),'live']:['',''];
  el.textContent=txt;el.className=cls;el.hidden=!txt;
}

// ===== Fil ===================================================================
const chat=$('chat');
let live=null,liveText='',activity=null,lastDay=null;
const nearBottom=()=>chat.scrollHeight-chat.scrollTop-chat.clientHeight<140;
const toBottom=()=>{chat.scrollTop=chat.scrollHeight};
chat.addEventListener('scroll',()=>$('scrollbtn').classList.toggle('show',!nearBottom()),{passive:true});
$('scrollbtn').onclick=()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
// Le fil réserve sous lui la hauteur réelle de la zone de saisie (elle grandit avec le texte).
new ResizeObserver(()=>{
  const stick=nearBottom();
  $('main').style.setProperty('--composer-h',$('composer').offsetHeight+'px');
  if(stick)toBottom();
}).observe($('composer'));

function add(cls,html){
  const el=document.createElement('div');el.className=cls;el.innerHTML=html;
  chat.insertBefore(el,activity);                 // la ligne d'activité reste toujours en dernier
  return el;
}
function dayMark(ts){
  const d=new Date(ts),now=new Date();
  if(lastDay&&sameDay(d,lastDay))return;
  lastDay=d;
  const yesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  const opt={weekday:'long',day:'numeric',month:'long'};
  if(d.getFullYear()!==now.getFullYear())opt.year='numeric';
  add('daysep',esc(sameDay(d,now)?t('today'):sameDay(d,yesterday)?t('yesterday'):d.toLocaleDateString(LANG,opt)));
}
const fileChip=(name,icon,extra)=>'<span class="cf-icon">'+ICON[icon]+'</span><span class="cf-name">'+esc(name)+'</span>'+(extra||'');
function addMsg(m){
  if(m.ts)dayMark(m.ts);
  let el;
  if(m.role==='user'){
    if(m.files&&m.files.length)add('msg-files',m.files.map(p=>{
      const name=String(p).split('/').pop();
      return '<div class="chip-file">'+fileChip(name,/\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(name)?'image':'file')+'</div>';
    }).join(''));
    el=add('msg user',esc(m.text));
  }else if(m.role==='error'){
    el=add('msg assistant errmsg',esc(m.text));
  }else{
    el=add('msg assistant'+(m.kind==='failed'?' failed':''),(m.kind==='task'?'<div class="task-tag">'+ICON.clock+esc(t('chat.task'))+'</div>':'')+'<div class="body">'+md(m.text)+'</div>');
  }
  if(m.ts)el.dataset.time=fmtTime(m.ts);          // affichée sous le message par la CSS, au survol
  syncEmpty();
  return el;
}
// Au doigt, pas de survol : toucher un message montre son heure, toucher ailleurs dans le fil la retire.
chat.addEventListener('click',e=>{
  if(matchMedia('(hover:hover)').matches)return;
  const m=e.target.closest('.msg[data-time]');
  chat.querySelectorAll('.msg.when').forEach(el=>{if(el!==m)el.classList.remove('when')});
  if(m)m.classList.toggle('when');
});
// Ligne d'activité : « AJEAN réfléchit… », puis le libellé de l'outil en cours.
function setActivity(label){
  if(!activity){activity=document.createElement('div');activity.className='genstatus';chat.appendChild(activity)}
  activity.innerHTML='<svg class="jlogo logo" viewBox="0 0 12 12"><use href="#mark"/></svg><span class="gtxt">'+esc(label||t('chat.thinking'))+'…</span>';
  syncEmpty();
}
function clearLive(){
  if(live)live.remove();
  if(activity)activity.remove();
  live=activity=null;liveText='';
}
function syncEmpty(){
  $('ce-title').textContent=t(S.configured?'chat.empty':'chat.empty_setup');
  $('chat-empty').classList.toggle('show',!chat.firstElementChild);
}
function setBusy(b){
  S.busy=b;
  $('send').classList.toggle('is-off',b);
  $('stop').classList.toggle('is-off',!b);
}

// ===== Outils : phrases de la ligne d'activité ===============================
// Un outil simple a sa phrase dans le dictionnaire (tool.<nom>). « tools »,
// « browser » et « app » : le serveur envoie label = « action cible ». Le premier
// mot choisit la phrase (act.<outil>.<action> ; la dernière règle de chaque liste
// attrape le reste) ; `true` = la cible est affichée à la suite. Une phrase peut
// dépendre de la cible : enregistrer une app déjà connue, c'est la mettre à jour.
const ACTION_LABELS={
  tools:[[/^(run|call|exec|use|lance)/,'run',true],[/^(create|make|new|write|save|build|fabrique|cr[ée]e)/,'create',true],
    [/^(update|edit|patch|fix|modifi|corrige)/,'update',true],[/^(delete|remove|supprime)/,'delete',true],
    [/^(read|show|get|view|lis)/,'read',true],[/^(list|liste)/,'list'],[/^/,'any']],
  browser:[[/^(open|goto|go|navigate|visit|load|ouvr)/,'open',true],[/^(click|clic)/,'click'],[/^(type|fill|input|write|saisi)/,'type'],
    [/^(read|text|extract|content|get|lis)/,'read'],[/^(screenshot|capture|look)/,'look'],[/^(scroll|d[ée]file)/,'scroll'],
    [/^(search|cherche)/,'search',true],[/^(back|retour)/,'back'],[/^(close|ferme)/,'close'],[/^/,'any']],
  app:[[/^save/,target=>apps.some(a=>a.id===target||a.name===target)?'update':'create',true],[/^edit/,'edit',true],
    [/^read/,'read',true],[/^list/,'list'],[/^errors/,'errors',true],[/^/,'any']],
};
function toolLabel(ev){
  if(I18N['tool.'+ev.name])return t('tool.'+ev.name);
  const label=String(ev.label||'').trim();
  if(/^j(e\s|['’])/i.test(label))return label;     // phrase déjà rédigée par le serveur
  const rules=ACTION_LABELS[ev.name];
  if(!rules)return ev.name||t('tool.generic');
  const [action,...rest]=label.split(/\s+/);
  let target=rest.join(' ');
  if(ev.name==='browser')try{target=new URL(target).hostname.replace(/^www\./,'')}catch(e){}
  const [,act,withTarget]=rules.find(r=>r[0].test(action.toLowerCase()));
  return t('act.'+ev.name+'.'+(typeof act==='function'?act(target):act))+(withTarget&&target?' '+target:'');
}

// ===== Conversations =========================================================
const convTitle=c=>c.title||t('side.new');
function renderConvs(){
  const list=$('conv-list'),now=new Date();
  const convs=[...S.convs].sort((a,b)=>b.ts-a.ts);
  list.innerHTML=convs.length?'':'<div class="sess-empty">'+esc(t('side.empty'))+'</div>';
  const dayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const groupOf=ts=>t(ts>=dayStart?'today':ts>=dayStart-864e5?'yesterday':ts>=dayStart-6*864e5?'group.week':'group.older');
  let group='';
  for(const c of convs){
    const g=groupOf(c.ts);
    if(g!==group){group=g;const h=document.createElement('div');h.className='sess-head';h.textContent=g;list.appendChild(h)}
    const row=document.createElement('div');
    row.className='sess-row'+(c.id===S.conv?' active':'');row.tabIndex=0;row.setAttribute('role','button');
    row.innerHTML='<span class="sess-name">'+esc(convTitle(c))+'</span>'+
      (c.busy?'<span class="sess-dot" role="img" aria-label="'+esc(t('conv.busy'))+'"></span>':unseen.has(c.id)?'<span class="sess-unseen" role="img" aria-label="'+esc(t('conv.unseen'))+'"></span>':'')+
      '<button class="sess-menu-btn" title="'+esc(t('conv.options_title'))+'" aria-label="'+esc(t('conv.options'))+'">'+ICON.dots+'</button>';
    row.onclick=e=>{
      if(!e.target.closest('.sess-menu-btn'))return switchConv(c.id);
      openMenu(e.target.closest('.sess-menu-btn'),[
        {label:t('rename'),icon:'edit',act:()=>renameConv(c)},
        {label:t('delete'),icon:'trash',danger:true,act:()=>deleteConv(c)},
      ],{align:'right'});
    };
    row.onkeydown=e=>{if(e.key==='Enter'&&e.target===row)switchConv(c.id)};
    list.appendChild(row);
  }
  renderStatus();
}
async function renameConv(c){
  const title=await ask({title:t('conv.rename'),ok:t('rename'),input:true,value:convTitle(c)});
  if(!title||!title.trim()||title.trim()===c.title)return;
  try{await api('/api/convs/rename',{conv:c.id,title:title.trim()});await refresh()}catch(e){toast(e.message)}
}
async function deleteConv(c){
  if(!await ask({title:t('conv.delete'),msg:t('conv.delete_msg',convTitle(c)),ok:t('delete'),danger:true}))return;
  try{
    await api('/api/convs/delete',{conv:c.id});
    unseen.delete(c.id);
    await(c.id===S.conv?loadState(''):refresh());
  }catch(e){toast(e.message)}
}
function switchConv(id){
  toggleSide(false);
  if(id!==S.conv)loadState(id).catch(e=>toast(e.message));
}
$('new-conv').onclick=async()=>{
  toggleSide(false);
  // Déjà sur une conversation vierge : inutile d'en empiler une autre.
  if(S.conv&&(chat.firstElementChild||S.busy)){
    try{const r=await api('/api/convs/new',{});await loadState(r.conv)}catch(e){toast(e.message)}
  }
  input.focus();
};

// Tiroir (téléphone).
function toggleSide(open){
  $('side').classList.toggle('open',open);
  document.body.classList.toggle('drawer-open',open);
}
$('menubtn').onclick=()=>toggleSide(true);
$('backdrop').onclick=()=>toggleSide(false);

// Largeur de la barre (ordinateur) : on glisse la poignée de son bord droit. Les
// événements du pointeur sont capturés par la poignée : rien d'autre ne les reçoit
// pendant le glissement, pas même l'iframe d'une app. La CSS borne la largeur ; un
// double-clic rend celle d'origine ; au clavier, les flèches gauche et droite.
const grip=$('side-grip');
function setSideW(w){
  w=Math.round(Math.max(200,Math.min(w,innerWidth*.4)));
  document.documentElement.style.setProperty('--side-w',w+'px');store.set('ajean-side',w);
}
if(+store.get('ajean-side'))setSideW(+store.get('ajean-side'));
grip.onpointerdown=e=>{
  if(e.button)return;
  e.preventDefault();grip.setPointerCapture(e.pointerId);grip.classList.add('drag');document.body.classList.add('resizing');
};
grip.onpointermove=e=>{if(grip.classList.contains('drag'))setSideW(e.clientX-$('side').getBoundingClientRect().left)};
grip.onpointerup=grip.onpointercancel=()=>{grip.classList.remove('drag');document.body.classList.remove('resizing')};
grip.ondblclick=()=>{document.documentElement.style.removeProperty('--side-w');store.set('ajean-side','')};
grip.onkeydown=e=>{
  const d=e.key==='ArrowLeft'?-16:e.key==='ArrowRight'?16:0;
  if(d){e.preventDefault();setSideW($('side').offsetWidth+d)}
};

// ===== Chargement de l'état ==================================================
// loadState : charge une conversation et redessine son fil. refresh : met à jour
// la barre latérale et l'en-tête SANS toucher au fil (une réponse peut y être en
// cours de diffusion), sauf si la conversation affichée a disparu.
let stateSeq=0;
const fetchState=id=>api('/api/state'+(id?'?conv='+encodeURIComponent(id):''));
function applyMeta(s){
  setLang(s.language||'');
  S.configured=s.configured;S.presets=s.presets||[];S.transcribe=!!s.transcribe;S.convs=s.convs||[];
  if(s.preset)S.preset=s.preset;
  // Le modèle n'est rappelé à côté du nom que s'il dit autre chose (une configuration porte souvent le nom de son modèle).
  $('preset-name').textContent=S.preset.name||S.preset.model;
  $('preset-model').textContent=S.preset.name&&S.preset.model!==S.preset.name?S.preset.model:'';
  $('preset-btn').hidden=$('effort-btn').hidden=!S.configured;
  $('effort-name').textContent=effortLabel(S.preset.effort);
  syncMic();syncSend();
}
function drawState(s){
  applyMeta(s);
  S.conv=s.conv||'';store.set('ajean-conv',S.conv);unseen.delete(S.conv);
  chat.innerHTML='';lastDay=null;live=activity=null;liveText='';
  for(const m of s.log||[])addMsg(m);
  chat.querySelectorAll('.msg.user').forEach(e=>e.style.animation='none');   // pas d'effet d'arrivée sur l'historique
  setBusy(!!s.busy);if(s.busy)setActivity('');
  syncEmpty();renderConvs();toBottom();
}
async function loadState(id){
  const seq=++stateSeq,s=await fetchState(id);
  if(seq===stateSeq)drawState(s);                  // sinon une demande plus récente est partie entre-temps
}
async function refresh(){
  const seq=stateSeq,s=await fetchState(S.conv);
  if(seq!==stateSeq)return;
  if((s.conv||'')!==S.conv)return loadState(s.conv);
  // La langue a changé : le fil porte des textes de l'interface (dates, étiquettes), il est redessiné lui aussi.
  if(langOf(s.language||'')!==LANG)return drawState(s);
  applyMeta(s);syncEmpty();renderConvs();
}

// ===== Événements du serveur (SSE) ==========================================
// Les messages n'entrent dans le fil QUE par ici (jamais à l'envoi) : une seule
// source, pas de doublon. Un événement d'une autre conversation ne touche que la
// barre latérale.
function onEvent(ev){
  switch(ev.type){
    case 'convs':refresh().catch(()=>{});return;
    case 'memory':if(modalOpen('mem-modal'))loadMemory();return;
    case 'sleep':sleeping=ev.state==='start';renderStatus();if(modalOpen('mem-modal'))loadMemory();return;
    case 'tasks':if(modalOpen('tasks-modal'))loadTasks();return;
    case 'apps':syncApps();return;
    case 'embed':if(cfg&&modalOpen('set-modal')&&setTab==='voice')loadEmbLocal().catch(()=>{});return;
  }
  const here=ev.conv===S.conv,c=S.convs.find(c=>c.id===ev.conv);
  if(c){
    if(ev.type==='start')c.busy=true;
    if(ev.type==='done'||ev.type==='stopped'||ev.type==='error')c.busy=false;
    if(ev.ts)c.ts=ev.ts;
    if(ev.type==='done'&&!here)unseen.add(c.id);
    if(ev.type!=='delta'&&ev.type!=='tool')renderConvs();
  }
  if(ev.type==='done')notify(ev,c);
  if(!here)return;

  const stick=nearBottom();
  switch(ev.type){
    case 'user':addMsg({role:'user',text:ev.text,ts:ev.ts,files:ev.files});break;
    case 'start':clearLive();setBusy(true);setActivity('');break;
    case 'delta':
      if(!live){live=add('msg assistant','<div class="body"></div>');setActivity(t('chat.writing'))}
      liveText+=ev.text;live.firstChild.innerHTML=md(liveText);
      break;
    case 'tool':setActivity(toolLabel(ev));break;
    case 'done':clearLive();setBusy(false);addMsg({role:'assistant',text:ev.text,ts:ev.ts,kind:ev.kind});break;
    case 'stopped':clearLive();setBusy(false);add('daysep',esc(t('chat.stopped')));break;
    case 'error':clearLive();setBusy(false);addMsg({role:'error',text:ev.error||t('chat.error')});break;
  }
  if(stick||ev.type==='user')toBottom();
}
function connect(){
  const es=new EventSource('/api/events');
  let first=true;
  es.onopen=()=>{
    offline=false;renderStatus();
    if(!first)loadState(S.conv).catch(()=>{});     // reconnexion : on a pu manquer des événements
    first=false;
  };
  es.onerror=()=>{
    offline=true;renderStatus();
    // Serveur injoignable : le navigateur réessaie de lui-même. Flux fermé pour de
    // bon : le serveur a refusé (session éteinte ou fermée depuis un autre appareil).
    // On relit l'état, ce qui amène l'écran de connexion, puis on rouvre le flux.
    if(es.readyState!==EventSource.CLOSED)return;
    const again=()=>loadState(S.conv).then(connect,()=>setTimeout(again,5000));
    again();
  };
  es.onmessage=e=>{let ev;try{ev=JSON.parse(e.data)}catch(err){return}onEvent(ev)};
}

// Quand une réponse arrive onglet caché, ou quand une tâche rend compte.
function notify(ev,conv){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  if(!document.hidden&&ev.kind!=='task')return;
  try{
    const n=new Notification(ev.kind==='task'?t('notif.task'):conv&&conv.title?'AJEAN · '+conv.title:'AJEAN',
      {body:String(ev.text||'').replace(/[*_`#>]/g,'').slice(0,220),icon:'/icon.png',tag:'ajean-'+ev.conv});
    n.onclick=()=>{window.focus();switchConv(ev.conv);n.close()};
  }catch(e){}
}

// ===== Saisie et envoi =======================================================
const input=$('input');
let sending=false;
function autoGrow(){
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,160)+'px';
  input.style.overflowY=input.scrollHeight>160?'auto':'hidden';
}
function syncSend(){$('send').disabled=!input.value.trim()&&!attachments.some(a=>a.path)}
input.addEventListener('input',()=>{autoGrow();syncSend()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('send').onclick=send;
$('stop').onclick=()=>api('/api/stop',{conv:S.conv}).catch(e=>toast(e.message));

async function send(){
  if(S.busy||sending)return;
  if(attachments.some(a=>a.state==='up'))return toast(t('chat.uploading'));
  const text=input.value.trim(),sent=attachments.filter(a=>a.path);
  if(!text&&!sent.length)return;
  if(!S.configured)return openSettings();
  stopDictation();
  const typed=input.value;
  sending=true;input.value='';attachments=[];renderAttach();autoGrow();
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
  try{
    // Aucune conversation : on en crée une et on s'y place AVANT d'envoyer, pour
    // que l'événement « user » trouve son fil.
    if(!S.conv)await loadState((await api('/api/convs/new',{})).conv);
    await api('/api/send',{conv:S.conv,text,tz,files:sent.map(a=>a.path)});
  }catch(e){
    // Rien n'est parti : on rend à l'utilisateur son texte et ses fichiers.
    if(!input.value)input.value=typed;
    attachments=sent.concat(attachments);renderAttach();autoGrow();toast(e.message);
  }
  sending=false;syncSend();
}

// ===== Pièces jointes ========================================================
// Chaque fichier est envoyé tout de suite à /api/upload (il est rangé dans le
// WORKSPACE) ; la pastille porte son état, et son chemin part avec le message. Un
// envoi refusé dit pourquoi dans un toast, et sa pastille reste, marquée en échec.
let attachments=[];               // {id, name, size, image, state:'up'|'ok'|'err', path?}
let attachSeq=0;
function renderAttach(){
  const box=$('attach-list');
  box.classList.toggle('show',attachments.length>0);
  box.innerHTML=attachments.map(a=>'<div class="chip-file '+a.state+'">'+
    fileChip(a.name,a.image?'image':'file','<span class="cf-size">'+(a.state==='err'?t('attach.failed'):fmtSize(a.size))+'</span>'+
    '<button class="cf-x" data-id="'+a.id+'" title="'+t('remove')+'" aria-label="'+esc(t('attach.remove',a.name))+'">'+ICON.x+'</button>')+'</div>').join('');
  syncSend();
}
$('attach-list').onclick=e=>{
  const b=e.target.closest('.cf-x');if(!b)return;
  attachments=attachments.filter(a=>a.id!==+b.dataset.id);renderAttach();
};
function addFiles(files){
  for(const f of files){
    const a={id:++attachSeq,name:f.name||'image.png',size:f.size,image:/^image\//.test(f.type),state:'up'};
    attachments.push(a);
    const fd=new FormData();fd.append('file',f,a.name);
    api('/api/upload',fd)
      .then(r=>Object.assign(a,{state:'ok',path:r.path,name:r.name||a.name,size:r.size??a.size,image:!!r.image}))
      .catch(e=>{a.state='err';toast(e.message)})
      .then(()=>{if(attachments.includes(a))renderAttach()});   // retirée entre-temps : on ne la ressuscite pas
  }
  renderAttach();
}
$('attach-btn').onclick=()=>$('attach-input').click();
$('attach-input').onchange=e=>{addFiles(e.target.files);e.target.value=''};
input.addEventListener('paste',e=>{
  const files=[...(e.clipboardData?.files||[])];
  if(files.length){e.preventDefault();addFiles(files)}
});
// Glisser-déposer sur toute la fenêtre ; le compteur évite le clignotement du voile
// quand le pointeur passe d'un élément à l'autre.
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
const veil=on=>$('dropveil').classList.toggle('show',on);
addEventListener('dragenter',e=>{if(hasFiles(e)&&!modalOpen('files-modal')){dragDepth++;veil(true)}});
addEventListener('dragleave',e=>{if(hasFiles(e)&&--dragDepth<=0){dragDepth=0;veil(false)}});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{
  if(!hasFiles(e))return;
  if(modalOpen('files-modal')){e.preventDefault();return}
  e.preventDefault();dragDepth=0;veil(false);addFiles(e.dataTransfer.files);
});

// ===== Dictée ================================================================
// Deux voies, un seul bouton. Si une API de transcription est réglée, le micro est
// ENREGISTRÉ ; un second clic arrête, l'audio part à /api/transcribe et le texte
// reçu s'insère à la position du curseur. Sinon, c'est la reconnaissance vocale du
// navigateur, dans la langue de l'interface faute de pouvoir deviner celle que l'on
// va parler : le texte reconnu s'ajoute au fil de l'eau à ce qui est déjà saisi.
// Le bouton reste masqué si aucune des deux voies n'est possible.
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);

const viaApi=()=>S.transcribe&&canRecord;
let dictation=null;               // ce qui écoute en ce moment (un MediaRecorder ou une reconnaissance) : il sait .stop()
function stopDictation(){if(dictation)dictation.stop()}
function syncMic(){$('mic-btn').hidden=!viaApi()&&!Recognition}
// '' : au repos ; 'rec' : à l'écoute ; 'busy' : transcription en cours, bouton inerte.
function micState(state){
  $('mic-btn').classList.toggle('rec',state==='rec');$('mic-btn').disabled=state==='busy';
  $('mic-hint').textContent=t(state==='busy'?'mic.transcribing':'mic.listening');$('mic-hint').hidden=!state;
}
async function recordDictation(){
  let stream;
  $('mic-btn').disabled=true;       // le temps que le navigateur demande l'autorisation : pas de second enregistrement
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){
    return toast(t(e.name==='NotAllowedError'||e.name==='SecurityError'?'mic.denied':e.name==='NotFoundError'?'mic.missing':'mic.fail'));
  }
  finally{$('mic-btn').disabled=false}
  const rec=new MediaRecorder(stream),chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());dictation=null;   // le témoin du micro s'éteint tout de suite
    // Le serveur reconnaît le format à l'extension : elle suit le type réellement enregistré (webm, mp4, ogg…).
    const type=(rec.mimeType||'audio/webm').split(';')[0],ext=type.split('/')[1]||'webm';
    const audio=new Blob(chunks,{type}),fd=new FormData();
    if(!audio.size)return micState('');
    fd.append('file',audio,'dictee.'+(ext==='mpeg'?'mp3':ext));
    micState('busy');
    try{
      const text=String((await api('/api/transcribe',fd)).text||'').trim();
      if(!text)toast(t('mic.silent'));
      else{
        // Inséré là où est le curseur, séparé par une espace de ce qui l'entoure.
        const a=input.selectionStart,b=input.selectionEnd,v=input.value;
        input.setRangeText((a&&!/\s$/.test(v.slice(0,a))?' ':'')+text+(b<v.length&&!/^\s/.test(v.slice(b))?' ':''),a,b,'end');
        autoGrow();syncSend();
      }
    }catch(e){toast(e.message)}
    micState('');input.focus();
  };
  rec.start();dictation=rec;micState('rec');
}
function browserDictation(){
  const rec=new Recognition(),base=input.value?input.value.replace(/\s*$/,' '):'';
  rec.lang={fr:'fr-FR',en:'en-US',vi:'vi-VN'}[LANG];rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    input.value=base+Array.from(e.results,r=>r[0].transcript).join('').trimStart();autoGrow();syncSend();
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')toast(t('mic.denied'));
    else if(e.error!=='aborted'&&e.error!=='no-speech')toast(t('mic.interrupted',e.error));
  };
  rec.onend=()=>{dictation=null;micState('');input.focus()};
  try{rec.start()}catch(e){return toast(t('mic.nostart'))}
  dictation=rec;micState('rec');
}
$('mic-btn').onclick=()=>dictation?stopDictation():viaApi()?recordDictation():browserDictation();

// ===== Écran Tâches ==========================================================
// Une tâche : une consigne qu'AJEAN exécute seul, ou un de ses outils lancé sans le
// modèle, une fois ou régulièrement. La liste se recharge à chaque événement
// « tasks » ; les tâches dépliées le restent d'un rendu à l'autre.
let tasks=null;                   // réponse de /api/tasks : {paused, tasks}
const taskOpen=new Set();         // ids des tâches dépliées
// Statut d'une exécution → [classe de la pastille, libellé].
const RUN_STATUS={ok:['ok','run.ok'],rien:['rien','run.none'],erreur:['err','run.err'],'arrêtée':['stop','run.stopped']};
const runStatus=r=>{const s=RUN_STATUS[r.status];return s?[s[0],t(s[1])]:['',String(r.status||'')]};

function taskRow(task,i){
  const runs=[...(task.runs||[])].sort((a,b)=>new Date(b.at)-new Date(a.at));
  const [cls,state]=task.running?['run',t('task.running')]:runs.length?[runStatus(runs[0])[0],t('task.last',runStatus(runs[0])[1])]:['',t('task.never')];
  const next=task.running?t('task.next_running'):!task.enabled?t('task.off'):tasks.paused?t('task.paused'):fmtNext(task.next);
  const open=taskOpen.has(task.id);
  return '<div class="task'+(task.enabled?'':' off')+'">'+

let files={path:'',entries:[]};
const FOLDER_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>';

async function loadFiles(p){

async function fileDownload(p){
  try{
    const r=await fetch('/api/files/get?dl=1&path='+encodeURIComponent(p));
    if(!r.ok){let j={};try{j=await r.json()}catch(_){}throw new Error(j.error||t('api.error',r.status))}
    const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');
    a.href=u;a.download=p.split('/').pop();document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),30000);
  }catch(e){setStatus('files-status',e.message,'err')}
}
const FILE_ACTIONS={
  open(e){loadFiles(fjoin(files.path,e.name))},

async function filesUpload(list){

// Déposer des fichiers sur la liste : ils vont dans le dossier affiché, pas dans

// Formulaire d'une tâche. Les choix en pastilles (type, moment, jours, icône,
// couleur) gardent leur état dans le DOM. taskInit retient ce que le formulaire
// contenait à l'ouverture : en modification, seuls les champs changés partent.
let taskEdit=null,taskInit=null,taskTools=[];
const WHEN=['at','every','unit','time','days','day'];   // les champs du moment partent ensemble
// Teintes sobres proposées pour la pastille ; '' : automatique (la teinte neutre du thème).
const COLORS=['','#c2553f','#c9792f','#b8962e','#6f9a3d','#3f9a6b','#2f968f','#3b86b8','#4a6fc4','#6b5fc2','#9457b5','#b8558f','#6f7480'];
$('t-icons').innerHTML=Object.keys(GLYPHS).map(n=>'<button data-v="'+n+'" aria-label="'+n+'">'+svg(GLYPHS[n],17,1.8)+'</button>').join('');
// Montre les champs qui vont avec les choix en cours, et accorde les libellés.
function syncTaskForm(){
  const byTool=segValues('t-kind')[0]==='tool',every=segValues('t-mode')[0]==='every',unit=$('t-unit').value;
  $('t-ico').innerHTML=glyph(segValues('t-icons')[0],segValues('t-colors')[0],'sm');
  $('t-prompt').hidden=byTool;$('t-tool-f').hidden=!byTool;
  $('t-once').hidden=every;$('t-every').hidden=!every;
  $('t-all').textContent=t('every.'+unit);
  for(const o of $('t-unit').options)o.textContent=t('unit.'+o.value,+$('t-n').value);
  $('t-days').hidden=unit!=='week';$('t-day-f').hidden=unit!=='month';
  $('t-time-row').hidden=unit==='minute'||unit==='hour';
  const tool=taskTools.find(o=>o.name===$('t-tool').value),params=Object.entries(tool&&tool.params||{});
  $('t-tool-hint').textContent=tool?tool.description+(params.length?t('task.params',params.map(([k,v])=>k+' ('+v+')').join(', ')):''):'';
}
function readTask(){
  const byTool=segValues('t-kind')[0]==='tool',unit=$('t-unit').value;
  const d={name:$('t-name').value.trim(),icon:segValues('t-icons')[0],color:segValues('t-colors')[0],
    prompt:byTool?'':$('t-prompt').value.trim(),tool:byTool?$('t-tool').value:'',conv:$('t-conv').value,quiet:$('t-quiet').checked};
  if(byTool){
    const args=$('t-args').value.trim();
    try{d.args=args?JSON.parse(args):{}}catch(e){d.args=null}   // illisible : taskError le dira
  }
  if(segValues('t-mode')[0]==='once')d.at=($('t-date').value+' '+$('t-at').value).trim();
  else{
    d.every=Math.floor(+$('t-n').value)||0;d.unit=unit;
    if(unit!=='minute'&&unit!=='hour')d.time=$('t-time').value;
    if(unit==='week')d.days=segValues('t-days');
    if(unit==='month')d.day=+$('t-day').value;
  }
  return d;
}
// La clé du message d'erreur, ou '' si la tâche peut partir.
const taskError=d=>!d.name?'task.err_name'
  :!d.tool&&!d.prompt?(segValues('t-kind')[0]==='tool'?'task.err_tool':'task.err_prompt')
  :d.tool&&(!d.args||typeof d.args!=='object'||Array.isArray(d.args))?'task.err_args'
  :'at' in d?(d.at.length<16?'task.err_at':'')
  :d.every<1?'task.err_every'
  :d.time===''?'task.err_time'
  :d.days&&!d.days.length?'task.err_days'
  :'day' in d&&!(d.day>=1&&d.day<=31)?'task.err_day':'';
async function openTask(task){
  const s=task?task.schedule:{},two=n=>String(n).padStart(2,'0');
  let at=new Date(String(s.at||'').replace(' ','T'));
  if(!(at.getFullYear()>=2000))at=new Date(Date.now()+36e5);   // nouvelle tâche, ou tâche récurrente : dans une heure
  try{taskTools=(await api('/api/memory')).tools||[]}catch(e){taskTools=[]}
  taskEdit=task;setStatus('t-status','');
  $('t-title').textContent=t(task?'task.edit':'task.new');
  $('t-name').value=task?task.name:'';$('t-prompt').value=task&&task.prompt||'';$('t-quiet').checked=!!(task&&task.quiet);
  // Une couleur choisie par AJEAN hors des teintes proposées s'ajoute à la liste : elle reste sélectionnée.
  const color=task&&/^#[0-9a-f]{6}$/i.test(task.color||'')?task.color.toLowerCase():'';
  $('t-colors').innerHTML=[...new Set([...COLORS,color])].map(c=>'<button data-v="'+c+'"'+(c?'':' title="'+esc(t('task.color_auto'))+'"')+' aria-label="'+esc(c||t('task.color_auto'))+'">'+
    '<span class="sw'+(c?'" style="background:'+c+'"':' auto"')+'></span></button>').join('');
  setSeg('t-icons',[task?GLYPHS[task.icon]?task.icon:'app':'clock']);setSeg('t-colors',[color]);
  $('t-tool').innerHTML=taskTools.map(o=>'<option>'+esc(o.name)+'</option>').join('')||'<option value="">'+t('task.no_tools')+'</option>';
  if(task&&task.tool)$('t-tool').value=task.tool;
  $('t-args').value=task&&task.args?JSON.stringify(task.args):'';
  $('t-conv').innerHTML='<option value="">'+t('task.latest_conv')+'</option>'+[...S.convs].sort((a,b)=>b.ts-a.ts).map(c=>'<option value="'+esc(c.id)+'">'+esc(convTitle(c))+'</option>').join('');
  $('t-conv').value=task&&S.convs.some(c=>c.id===task.conv)?task.conv:'';
  setSeg('t-kind',[task&&task.tool?'tool':'model']);setSeg('t-mode',[s.every?'every':'once']);
  $('t-date').value=at.getFullYear()+'-'+two(at.getMonth()+1)+'-'+two(at.getDate());$('t-at').value=two(at.getHours())+':'+two(at.getMinutes());
  $('t-n').value=s.every||1;$('t-unit').value=s.unit||'day';$('t-time').value=s.time||'09:00';$('t-day').value=s.day||1;setSeg('t-days',s.days||['mon']);
  syncTaskForm();taskInit=readTask();
  showModal('task-modal');
  if(!task)$('t-name').focus();
}
$('task-modal').addEventListener('click',e=>{
  const b=e.target.closest(':is(.seg,.days,.picker) button');if(!b)return;
  if(b.parentNode.id==='t-days')b.classList.toggle('on');else setSeg(b.parentNode.id,[b.dataset.v]);
  syncTaskForm();
});
$('task-modal').addEventListener('input',syncTaskForm);
$('t-save').onclick=async()=>{
  const d=readTask(),err=taskError(d);
  if(err)return setStatus('t-status',t(err),'err');
  let body={...d,enabled:true};
  if(taskEdit){
    const changed=k=>JSON.stringify(d[k])!==JSON.stringify(taskInit[k]);
    const when=WHEN.some(changed);
    body={id:taskEdit.id};
    for(const k in d)if(WHEN.includes(k)?when:changed(k))body[k]=d[k];
  }
  try{await api('/api/tasks/save',body);hideModal('task-modal');loadTasks()}
  catch(e){setStatus('t-status',e.message,'err')}
};

// ===== Écran Applications ====================================================
// AJEAN fabrique de petites applications web ; on les ouvre ici. Une app tourne
// dans une iframe sandbox="allow-scripts" SANS allow-same-origin : son document n'a
// pas d'origine, il ne peut appeler aucune route d'AJEAN. Elle ne parle qu'à cette
// page, par postMessage ; la page relaie à /api/apps/bridge avec l'id de l'app
// qu'ELLE a ouverte, jamais un id venu du message.
let apps=[];                      // réponse de /api/apps (sert aussi aux libellés de la ligne d'activité)
let appRun=null;                  // l'app ouverte : {app, html, frame}
const APP_OPS=['storage.get','storage.set','storage.remove','storage.keys','tools.run','ai.ask','error'];
const appPage=id=>api('/api/apps/page?id='+encodeURIComponent(id));

// La pastille d'une app désignée par son id (le bouton d'un lien, dans un message) ;
// celle par défaut tant que la liste des apps n'est pas arrivée.
const appGlyph=id=>{const a=apps.find(a=>a.id===id)||{};return glyph(a.icon,a.color,'xs')};
async function loadApps(){
  try{
    apps=(await api('/api/apps')).apps||[];
    $('apps-list').innerHTML=apps.length?'<div class="apps-grid">'+apps.map(a=>
      '<button class="app-card" data-app="'+esc(a.id)+'">'+glyph(a.icon,a.color)+
      '<span><span class="k">'+esc(a.name)+'</span><span class="meta">'+esc(a.description)+'</span></span>'+
      (a.errors>0?'<span class="badge err">'+t('app.errors',a.errors)+'</span>':'')+'</button>').join('')+'</div>'
      :'<div class="none">'+t('apps.empty')+'</div>';
    chat.querySelectorAll('button[data-app]').forEach(b=>{b.firstElementChild.outerHTML=appGlyph(b.dataset.app)});   // les liens déjà dans le fil
  }catch(e){$('apps-list').innerHTML='<div class="none">'+esc(e.message)+'</div>'}
}
function openApps(){
  toggleSide(false);
  showModal('apps-modal');loadApps();
}
$('open-apps').onclick=openApps;
// Une carte de la grille ou, dans un message, le bouton d'un lien [Nom](app:<id>).
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-app]');
  if(b)openApp(b.dataset.app);
});

// L'iframe est créée à l'ouverture et retirée à la fermeture : une app fermée n'a
// plus de fenêtre, donc plus aucun de ses messages n'est accepté.
function renderAppBar(){
  const a=appRun.app;
  $('app-ico').innerHTML=glyph(a.icon,a.color,'sm');$('app-name').textContent=a.name;$('app-ver').textContent='v'+a.version;
  $('app-errs').textContent=t('app.errors',a.errors);$('app-errs').hidden=!a.errors;
}
function mountApp(page){
  closeApp();
  const frame=document.createElement('iframe');
  frame.setAttribute('sandbox','allow-scripts');frame.title=page.app.name;frame.srcdoc=page.html;
  appRun={app:page.app,html:page.html,frame};
  $('app-stage').appendChild(frame);renderAppBar();
}
function closeApp(){
  if(appRun)appRun.frame.remove();
  appRun=null;
}
onModalClose['app-modal']=closeApp;
async function openApp(id){
  try{mountApp(await appPage(id));showModal('app-modal')}catch(e){toast(e.message)}
}
// Événement « apps » : la liste est relue, et l'app affichée aussi. Son iframe n'est
// remontée que si son document a changé (une erreur signalée ne la relance pas).
async function syncApps(){
  loadApps();
  const run=appRun;
  if(!run)return;
  try{
    const page=await appPage(run.app.id);
    if(appRun!==run)return;
    if(page.html!==run.html)mountApp(page);else{run.app=page.app;renderAppBar()}
  }catch(e){if(appRun===run){hideModal('ver-modal');hideModal('app-modal');toast(e.message)}}   // l'app n'existe plus
}

// Le pont. Un message n'est écouté que s'il vient de la fenêtre de l'app ouverte.
addEventListener('message',async e=>{
  const run=appRun,d=e.data;
  if(!run||e.source!==run.frame.contentWindow||!d||d.ajean!==1)return;
  let out;
  try{
    if(!APP_OPS.includes(d.op))throw new Error(t('app.unknown_op'));
    out={ok:true,result:(await api('/api/apps/bridge',{app:run.app.id,op:d.op,args:d.args||{}})).result};
  }catch(err){out={ok:false,error:err.message}}
  if(appRun!==run)return;
  if(d.op==='error'){run.app.errors=(run.app.errors||0)+1;renderAppBar()}
  else run.frame.contentWindow.postMessage({ajean:1,id:d.id,...out},'*');
});

$('app-back').onclick=()=>{hideModal('app-modal');if(!modalOpen('apps-modal'))openApps()};
$('app-reload').onclick=()=>openApp(appRun.app.id);
$('app-del').onclick=async()=>{
  const a=appRun.app;
  if(!await ask({title:t('app.delete_q',a.name),msg:t('app.delete_msg'),ok:t('delete'),danger:true}))return;
  hideModal('app-modal');           // fermée d'abord : l'événement « apps » de sa suppression ne la cherchera plus
  try{await api('/api/apps/delete',{id:a.id})}catch(e){toast(e.message)}
  openApps();
};
// Versions de l'app ouverte : revenir à l'une d'elles la recharge.
$('app-versions').onclick=async()=>{
  const a=appRun.app;
  $('ver-body').innerHTML='';showModal('ver-modal');
  try{
    const versions=(await api('/api/apps/versions?id='+encodeURIComponent(a.id))).versions||[];
    $('ver-body').innerHTML=listOf(versions.sort((x,y)=>y.version-x.version).map(v=>item(
      '<div class="k">'+t('ver.n',v.version)+(v.version===a.version?'<span class="badge">'+t('ver.current')+'</span>':'')+'</div>'+
      '<div class="meta">'+esc(fmtDate(v.at))+'</div>'+(v.note?'<div class="txt">'+esc(v.note)+'</div>':''),
      v.version===a.version?'':'<button class="btn sm" data-v="'+v.version+'">'+t('ver.back')+'</button>')),t('ver.none'));
  }catch(e){$('ver-body').innerHTML='<div class="none">'+esc(e.message)+'</div>'}
};
$('ver-body').onclick=async e=>{
  const v=e.target.dataset.v,id=appRun.app.id;
  if(!v)return;

// ===== Fenêtre Réglages ======================================================
// Un FOURNISSEUR est une API compatible OpenAI : un nom, une URL, une clé. Une
// CONFIGURATION est ce qu'on choisit pour discuter : un fournisseur, un modèle, un
// effort de réflexion. La dictée par API (transcription) et la recherche par le
// sens (embeddings) se branchent chacune sur un fournisseur, et restent
// facultatives ; la seconde peut aussi se passer de fournisseur, avec un moteur
// qu'AJEAN télécharge et fait tourner sur cette machine. Au premier lancement, rien de tout cela à comprendre : un seul
// formulaire, « Brancher une API », crée le fournisseur et sa première configuration.
let cfg=null,setTab='presets';    // réponse de /api/config ; onglet affiché
const KNOWN_APIS=[['OpenAI','https://api.openai.com/v1'],['Anthropic','https://api.anthropic.com/v1'],['OpenRouter','https://openrouter.ai/api/v1'],
  ['Mistral','https://api.mistral.ai/v1'],['Groq','https://api.groq.com/openai/v1'],['DeepSeek','https://api.deepseek.com/v1'],
  ['Google Gemini','https://generativelanguage.googleapis.com/v1beta/openai'],['Ollama','http://localhost:11434/v1'],['LM Studio','http://localhost:1234/v1']];
// Les deux branchements facultatifs : préfixe de leurs éléments → champ de /api/config,
// et ce qui, dans un nom de modèle, désigne ceux qui font ce travail (mis en tête par « Lister »).
const VOICE={stt:['transcribe',/whisper|transcri/i],emb:['embed',/embed/i]};
const provName=id=>(cfg.providers.find(p=>p.id===id)||{name:t('provider.unknown')}).name;
const provOptions=()=>cfg.providers.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');

function renderSettings(){
  const first=!cfg.providers.length;               // premier lancement : rien à gérer, une API à brancher
  // Sans fournisseur, « Brancher une API » remplace Modèles et Fournisseurs. Voix et
  // mémoire reste là : la recherche par le sens sur cet ordinateur n'en demande aucun.
  const managed=['presets','providers'];
  if(first&&managed.includes(setTab))setTab='setup';
  if(!first&&setTab==='setup')setTab='presets';
  for(const b of $('set-tabs').querySelectorAll('button'))b.hidden=b.dataset.v==='setup'?!first:first&&managed.includes(b.dataset.v);
  setSeg('set-tabs',[setTab]);
  for(const p of $('set-body').querySelectorAll('[data-pane]'))p.hidden=p.dataset.pane!==setTab;
  $('set-foot').hidden=setTab!=='setup'&&setTab!=='voice';$('s-test').hidden=setTab!=='setup';
  $('s-env').hidden=!cfg.env;
  $('presets-list').innerHTML=listOf(cfg.presets.map((p,i)=>item(
    '<div class="k">'+esc(p.name)+(p.id===cfg.active?'<span class="badge">'+t('preset.active')+'</span>':'')+'</div>'+
    '<div class="meta">'+esc(t('preset.meta',provName(p.provider),p.model,effortLabel(p.effort).toLowerCase()))+'</div>',
    (p.id===cfg.active?'':'<button class="btn sm" data-a="cuse" data-i="'+i+'">'+t('preset.use')+'</button>')+btn('cedit',i,'edit',t('edit'))+btn('cdel',i,'trash',t('delete'),true))),
    t('presets.empty'));
  $('prov-list').innerHTML=listOf(cfg.providers.map((p,i)=>item(
    '<div class="k">'+esc(p.name)+(p.has_key?'<span class="badge">'+t('provider.key_saved')+'</span>':'')+'</div><div class="meta">'+esc(p.api_url)+'</div>',
    btn('fedit',i,'edit',t('edit'))+btn('fdel',i,'trash',t('delete'),true))),'');
  renderDoor();
}
// ----- Sécurité : mot de passe de l'interface et appareils connectés ----------
// door : ce que /api/auth dit de la porte (un mot de passe existe-t-il, combien
// d'appareils sont connectés). Changer le mot de passe ferme toutes les sessions ;
// le serveur en rouvre une pour cet appareil dans la même réponse.
let door={};
function renderDoor(){
  const on=!!door.configured,many=door.sessions>1;
  $('sec-state').textContent=t(on?'sec.on':'sec.none');
  $('sec-pw').textContent=t(on?'sec.change':'sec.set');
  $('sec-others-row').hidden=$('sec-out-row').hidden=!on;
  $('sec-sessions').textContent=many?t('sec.sessions',door.sessions):t('sec.sessions1');
  $('sec-others').hidden=!many;
  $('sec-hint').textContent=t(!on?'sec.hint_none':door.env?'sec.hint_env':'sec.hint_on');
}
async function loadDoor(){door=await api('/api/auth');renderDoor()}
$('sec-pw').onclick=()=>{
  const on=!!door.configured;
  $('pw-title').textContent=t(on?'pw.change':'sec.set');
  $('pw-hint').textContent=t('pw.hint',door.min||10);
  $('pw-cur-field').hidden=!on;
  for(const id of ['pw-cur','pw-new','pw-again'])$(id).value='';
  setStatus('pw-status','');showModal('pw-modal');$(on?'pw-cur':'pw-new').focus();
};
$('pw-save').onclick=e=>formAct(e.currentTarget,'pw-status',t('saving'),async()=>{
  const min=door.min||10,next=$('pw-new').value;
  if([...next].length<min)throw new Error(t('pw.short',min));
  if(next!==$('pw-again').value)throw new Error(t('pw.differ'));
  await api('/api/auth/password',{current:$('pw-cur').value,password:next});
  hideModal('pw-modal');toast(t('pw.done'));await loadDoor();
});
$('sec-others').onclick=async()=>{
  try{await api('/api/auth/logout-others',{});toast(t('sec.others_done'));await loadDoor()}catch(e){toast(e.message)}
};
$('sec-out').onclick=async()=>{
  try{await api('/api/auth/logout',{})}catch(e){return toast(e.message)}
  location.reload();                               // la page repart de zéro, devant l'écran de connexion
};
// La recherche par le sens se lit dans deux réponses : /api/config dit ce qui est en
// service (un fournisseur, ou 'local'), /api/embed/local ce qui est installé sur
// cette machine (embLocal). La tuile du haut dit toujours le premier ; celle du
// moteur local dit où il en est et porte le bouton qui va avec : installer, annuler,
// activer, réessayer. Elle est redessinée à chaque pas d'un téléchargement : seuls
// ses textes changent, jamais les champs qu'on est en train de remplir.
let embLocal={state:'absent',model:'',size:0,progress:null,error:'',active:false},embSeq=0;
const embOn=()=>(cfg.embed||{}).provider||'';
function renderEmb(){
  const on=embOn(),L=embLocal,p=L.progress,way=segValues('v-emb-way')[0];
  const dl=L.state==='downloading',here=L.state==='ready'||L.state==='running',failed=L.state==='error';
  const pct=dl&&p&&p.total?Math.min(100,Math.floor(p.done/p.total*100)):null;   // null : rien à mesurer
  $('v-emb-state').textContent=!on?t('emb.none'):on==='local'?t('emb.on_local',L.model):t('emb.on',provName(on),cfg.embed.model);
  $('v-emb-off').hidden=!on;
  $('v-emb-local').hidden=way!=='local';$('v-emb-api').hidden=way!=='api';
  $('v-loc-title').innerHTML=esc(dl?t(!p?'emb.dl_start':p.what==='engine'?'emb.dl_engine':'emb.dl_model'):here?t('emb.installed',L.model):t(failed?'emb.failed':'emb.absent'))+
    (here&&on==='local'?'<span class="badge">'+t('emb.active')+'</span>':'');
  $('v-loc-meta').textContent=dl?(pct!==null?t('emb.progress',pct,fmtSize(p.done),fmtSize(p.total)):p?fmtSize(p.done):'')
    :here?(L.size?t('emb.disk',fmtSize(L.size)):''):failed?L.error:t('emb.absent_meta');
  $('v-loc-meta').classList.toggle('err',failed);
  $('v-loc-bar').hidden=pct===null;$('v-loc-bar').setAttribute('aria-valuenow',pct||0);$('v-loc-bar').firstChild.style.width=(pct||0)+'%';
  $('v-loc-main').textContent=dl?t('cancel'):here?t('emb.activate'):failed?t('emb.retry'):t($('v-loc-url').value.trim()?'emb.install_other':'emb.install');
  $('v-loc-main').classList.toggle('primary',!dl);$('v-loc-main').hidden=here&&on==='local';
  $('v-loc-test').hidden=$('v-loc-del').hidden=!here;
  $('v-loc-other').hidden=dl||here;                // un autre modèle se choisit avant d'installer, ou après un échec
}
async function loadEmbLocal(){
  const seq=++embSeq,L=await api('/api/embed/local');
  if(seq!==embSeq)return;                          // une lecture plus récente est partie entre-temps
  embLocal=L;
  // Le serveur met lui-même le moteur en service à la fin d'un téléchargement, et l'en
  // retire à la suppression : `active` fait foi, sans relire tous les réglages (ce
  // qui effacerait une saisie en cours).
  if(L.active!==(embOn()==='local'))cfg.embed={provider:L.active?'local':'',model:''};
  renderEmb();
}
// Remplit ce que la fenêtre montre des réglages enregistrés, puis l'affiche. La tuile
// d'état de la dictée et de la recherche par le sens dit ce qui est ENREGISTRÉ ; les
// champs dessous repartent de là.
function fillSettings(){
  for(const k in VOICE){
    const v=cfg[VOICE[k][0]]||{};
    $('v-'+k+'-provider').innerHTML=provOptions();
    if(v.provider&&v.provider!=='local')$('v-'+k+'-provider').value=v.provider;
    $('v-'+k+'-model').value=v.model||'';
  }
  const stt=cfg.transcribe||{};
  $('v-stt-state').textContent=stt.provider?t('stt.on',provName(stt.provider),stt.model):t('stt.none');
  $('v-stt-off').hidden=!stt.provider;
  // La voie montrée suit ce qui est en service ; rien n'est réglé : celle qu'on
  // regardait reste (au départ, cet ordinateur).
  if(embOn())setSeg('v-emb-way',[embOn()==='local'?'local':'api']);
  renderEmb();
  $('s-review').checked=!!cfg.review;$('s-sleep').checked=!!cfg.sleep;$('s-lang').value=cfg.language||'';
  for(const k of ['memory','workspace','tools'])$('d-'+k).textContent=(cfg.dirs&&cfg.dirs[k])||'';
  renderSettings();
}
async function loadConfig(){cfg=await api('/api/config');fillSettings()}
// Ce qui change dans les réglages se voit aussi hors de la fenêtre (configuration
// active, micro) : les réglages et l'état sont relus ensemble.
const reloadAll=()=>Promise.all([loadConfig(),refresh()]);
async function openSettings(tab){
  toggleSide(false);setStatus('s-status','');syncNotifButton();
  if(tab)setTab=tab;
  showModal('set-modal');
  try{await loadConfig();await loadDoor();await loadEmbLocal()}catch(e){toast(e.message)}
}
$('open-settings').onclick=()=>openSettings();
$('set-tabs').onclick=e=>{
  const tab=e.target.dataset.v;if(!tab||!cfg)return;   // réglages pas encore chargés : rien à afficher
  setTab=tab;setStatus('s-status','');$('set-body').scrollTop=0;renderSettings();
  if(tab==='voice')loadEmbLocal().catch(err=>toast(err.message));   // hors de cet onglet, ses événements ne sont pas suivis
};

// Lance l'action d'un formulaire en figeant son bouton le temps de la réponse ; ce
// qu'elle a à dire, erreur comprise, s'écrit dans la ligne d'état du formulaire.
async function formAct(button,status,pending,run){
  button.disabled=true;setStatus(status,pending);
  try{await run()}catch(e){setStatus(status,e.message,'err')}
  button.disabled=false;
}
// « Lister » : les modèles que le fournisseur annonce, dans le menu commun, posé
// sous le champ à remplir. Un clic le remplit. Certaines API en annoncent des
// centaines : au-delà de quelques lignes, le menu porte un filtre.
//   src   : {id} pour un fournisseur enregistré, {api_url, api_key} pour une saisie en cours
//   first : les modèles dont le nom y répond passent en tête (ceux qui font le travail demandé)
const listModels=(button,status,field,src,first)=>formAct(button,status,t('models.reading'),async()=>{
  let models=(await api('/api/providers/models',src)).models||[];
  if(first)models=[...models.filter(m=>first.test(m)),...models.filter(m=>!first.test(m))];
  setStatus(status,models.length?t('models.count',models.length)+'.':t('models.none'));
  if(models.length&&field.offsetParent)   // la fenêtre a pu être fermée pendant la lecture
    openMenu(field,models.map(m=>({label:m,on:m===field.value.trim(),act:()=>{field.value=m;field.focus()}})),{filter:models.length>8});
});
async function testModel(status,body){
  if(!body.model)throw new Error(t('model.need_test'));
  const r=await api('/api/providers/test',body);
  setStatus(status,t('model.ok',r.answer),'ok');
}
// Liste des API connues, au-dessus d'un champ d'URL : en choisir une remplit l'URL
// (et le nom, s'il y en a un) ; une URL saisie à la main remet la liste sur l'API
// reconnue, ou sur « Personnalisé… ».
const KNOWN_LISTS=[[$('s-known'),$('s-url')],[$('pv-known'),$('pv-url'),$('pv-name')]];
const syncKnown=(sel,url)=>{const v=url.value.trim();sel.value=KNOWN_APIS.some(a=>a[1]===v)?v:''};
function fillKnown(){
  for(const [sel,url] of KNOWN_LISTS){
    sel.innerHTML='<option value="">'+t('provider.custom')+'</option>'+KNOWN_APIS.map(([n,u])=>'<option value="'+u+'">'+n+'</option>').join('');
    syncKnown(sel,url);
  }
}
for(const [sel,url,name] of KNOWN_LISTS){
  sel.onchange=()=>{
    if(!sel.value)return;
    url.value=sel.value;if(name)name.value=sel.selectedOptions[0].textContent;
  };
  url.oninput=()=>syncKnown(sel,url);
}

// Une action sur une ligne des réglages : confirmation éventuelle, appel, relecture.
async function setAct(path,body,confirm){
  if(confirm&&!await ask({danger:true,ok:t('delete'),...confirm}))return;
  try{await api(path,body);await reloadAll()}catch(e){toast(e.message)}
}
const SET_ACTIONS={
  cnew(){openPreset(null)},
  cedit(i){openPreset(cfg.presets[i])},
  cuse(i){setAct('/api/presets/select',{id:cfg.presets[i].id})},
  cdel(i){const p=cfg.presets[i];setAct('/api/presets/delete',{id:p.id},{title:t('preset.delete_q',p.name),msg:t('preset.delete_msg')})},
  fnew(){openProvider(null)},
  fedit(i){openProvider(cfg.providers[i])},
  fdel(i){const p=cfg.providers[i];setAct('/api/providers/delete',{id:p.id},{title:t('provider.delete_q',p.name),msg:t('provider.delete_msg')})},
};
$('set-body').addEventListener('click',e=>{

});

// Premier lancement : le fournisseur porte le nom de l'API reconnue (sinon celui de
// son hôte), et la première configuration celui du modèle.
const readSetup=()=>({api_url:$('s-url').value.trim(),api_key:$('s-key').value.trim(),model:$('s-model').value.trim()});
async function saveSetup(){
  const d=readSetup(),known=KNOWN_APIS.find(a=>a[1]===d.api_url);
  if(!d.api_url||!d.model)throw new Error(t('setup.need'));

  const {id}=await api('/api/providers/save',{name,api_url:d.api_url,api_key:d.api_key});
  try{await api('/api/presets/save',{name:d.model,provider:id,model:d.model,effort:''})}
  catch(e){await reloadAll();return toast(e.message)}   // le fournisseur existe : les onglets prennent le relais, sans le créer deux fois
  $('s-key').value='';
  await refresh();hideModal('set-modal');toast(t('setup.done'));input.focus();
}
// Voix et mémoire. Un branchement dont le modèle est vide part désactivé. Pour la

// Le moteur local. Ses boutons agissent tout de suite, sans « Enregistrer » ; le

// Formulaire d'une configuration. Sans nom, elle prend celui de son modèle.
let presetEdit=null;
function openPreset(p){
  presetEdit=p;setStatus('pr-status','');
  $('pr-title').textContent=t(p?'preset.edit':'preset.new');
  $('pr-provider').innerHTML=provOptions();
  if(p)$('pr-provider').value=p.provider;
  $('pr-name').value=p?p.name:'';$('pr-model').value=p?p.model:'';$('pr-effort').value=p?p.effort:'';
  showModal('preset-modal');
  if(!p)$('pr-name').focus();
}
const readPreset=()=>{
  const model=$('pr-model').value.trim();
  return {...(presetEdit?{id:presetEdit.id}:{}),name:$('pr-name').value.trim()||model,provider:$('pr-provider').value,model,effort:$('pr-effort').value};
};
$('pr-list').onclick=e=>listModels(e.currentTarget,'pr-status',$('pr-model'),{id:$('pr-provider').value});
$('pr-test').onclick=e=>formAct(e.currentTarget,'pr-status',t('testing'),()=>testModel('pr-status',{id:$('pr-provider').value,model:$('pr-model').value.trim()}));
$('pr-save').onclick=e=>formAct(e.currentTarget,'pr-status',t('saving'),async()=>{
  const d=readPreset();
  if(!d.model)throw new Error(t('preset.need_model'));
  await api('/api/presets/save',d);
  hideModal('preset-modal');await reloadAll();
});

// ===== Démarrage =============================================================
// La dernière conversation ouverte sur cet appareil est rouverte ; au premier
// lancement (aucune API configurée), les réglages s'ouvrent d'eux-mêmes, sur
// « Brancher une API » tant qu'aucun fournisseur n'existe.
setLang(store.get('ajean-lang')||'');   // la langue du dernier passage, en attendant celle du serveur
syncSend();
loadState(store.get('ajean-conv')||'')
  .then(()=>{connect();loadApps();if(!S.configured)openSettings();else input.focus()})
  .catch(e=>{offline=true;renderStatus();add('msg assistant errmsg',esc(e.message))});
</script>
